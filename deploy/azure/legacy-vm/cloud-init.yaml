#cloud-config
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - unattended-upgrades
write_files:
  - path: /opt/sejong-bootstrap.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      set -euo pipefail
      hostname='__HOSTNAME__'
      revision='__REVISION__'
      [[ "$hostname" =~ ^[a-z0-9.-]+$ ]]
      [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
      systemctl enable --now docker
      git clone https://github.com/Becko0312/sejong.git /opt/sejong
      cd /opt/sejong
      git checkout --detach "$revision"
      cat > .env <<ENV
      SITE_ADDRESS=$hostname
      PUBLIC_ORIGIN=https://$hostname
      MAX_UPLOAD_MB=200
      MAX_PAGES=500
      RETENTION_HOURS=24
      ENV
      chmod 600 .env
      docker compose --profile public up --build -d
runcmd:
  - [bash, /opt/sejong-bootstrap.sh]
